name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  FOUNDRY_PROFILE: default

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      # Dependencies are vendored with --no-git rather than as submodules, so a fresh
      # checkout has to fetch them. Both are pinned by the install step below.
      - name: Install dependencies
        run: |
          forge install foundry-rs/forge-std --no-git
          forge install Uniswap/v4-core --no-git

      - name: Check formatting
        run: forge fmt --check

      - name: Build
        run: forge build --sizes

      - name: Test
        run: forge test -vv

      # The invariants ranked most severe in the threat model get a deeper run than the
      # default 256 cases: a revert in beforeSwap bricks a pool permanently, so the
      # no-revert property is worth the extra minute.
      - name: Deep fuzz the critical invariants
        run: forge test --match-test "NeverReverts|NeverOverflows|RoundTrips|Saturates"
        env:
          FOUNDRY_FUZZ_RUNS: 10000

      - name: Coverage
        # Gas assertions compare against measured budgets, and coverage instrumentation
        # inflates gas, so they are skipped here rather than left to fail.
        run: forge coverage --report summary
        env:
          VANE_SKIP_GAS_ASSERTIONS: "true"

      - name: Gas snapshot
        run: forge snapshot --check || forge snapshot

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1
      - name: Install dependencies
        run: |
          forge install foundry-rs/forge-std --no-git
          forge install Uniswap/v4-core --no-git
      - uses: crytic/slither-action@v0.4.0
        with:
          fail-on: medium
          slither-config: slither.config.json
          target: .

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
