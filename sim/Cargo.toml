[package]
name = "vane-sim"
version = "0.1.0"
edition = "2021"

[dependencies]
revm = "14.0"
alloy-primitives = "0.8"
alloy-sol-types = "0.8"
alloy-json-abi = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
rand_chacha = "0.3"
rayon = "1"
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 3
